[package]
name = "mira"
version = "0.1.0"
edition = "2021"

[workspace]
# Bare `cargo run` is the engine app; `cargo run --example <name>` finds the engine's examples.
default-members = [".", "crates/mira_app"]
members = ["crates/mira_app", "crates/mira_ecs", "crates/mira_plugin", "crates/mira_derive", "crates/mira_ui", "plugins/wave", "plugins/scoreboard"]

[dependencies]
mira_plugin = { path = "crates/mira_plugin" }
mira_derive = { path = "crates/mira_derive" }
mira_ecs = { path = "crates/mira_ecs" }
libloading = "0.8"
anyhow = "1"
bytemuck = { version = "1.13", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
half = { version = "2", features = ["bytemuck"] }
intel_tex_2 = "0.5"
log = "0.4"
pollster = "0.3"
wgpu = "30.0.1"
winit = "0.30.12"

# Debug builds keep what a failure's stack needs (functions by their full names, files and
# lines) and no more: with full debug information the build folder passed 45 GB. The
# engine's own crates keep that much; dependencies carry none. For a debugger that reads variables, set
# `CARGO_PROFILE_DEV_DEBUG=2` for that build.
[profile.dev]
debug = "limited"

[profile.dev.package."*"]
debug = false
