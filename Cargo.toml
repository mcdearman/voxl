[package]
name = "voxl"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/voxl_plugin", "plugins/wave"]

[dependencies]
voxl_plugin = { path = "crates/voxl_plugin" }
libloading = "0.8"
anyhow = "1"
bytemuck = { version = "1.13", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
pollster = "0.3"
wgpu = "26.0.1"
winit = "0.30.12"
