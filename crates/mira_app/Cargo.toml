[package]
name = "mira_app"
version = "0.1.0"
edition = "2021"
description = "mira, the engine app: a game shown, looked into and changed in a Neo window"
default-run = "mira"

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
mira = { path = "../.." }
mira_ui = { path = "../mira_ui" }
neo = { git = "https://github.com/mcdearman/neo", rev = "1b62dc227f9b9f455c1a5b653be26cb66170db4d" }
neo-desktop = { git = "https://github.com/mcdearman/neo", rev = "1b62dc227f9b9f455c1a5b653be26cb66170db4d" }
anyhow = "1"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
