# In-game user interface for mira, on Armature.
#
# This crate is not a member of the workspace: Armature is a private repository, found here
# beside mira's (../../../armature), so a checkout of mira alone cannot build it. Build and
# run it on its own:
#
#   cargo run --manifest-path crates/mira_ui/Cargo.toml --example sacred_sites_graph
[package]
name = "mira_ui"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
mira = { path = "../.." }
armature = { path = "../../../armature/crates/armature" }
armature-render = { path = "../../../armature/crates/armature-render" }
wgpu = "30.0.1"
winit = "0.30.12"
anyhow = "1"
log = "0.4"
