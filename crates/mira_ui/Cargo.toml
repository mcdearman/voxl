# In-game user interface for mira, on Armature.
[package]
name = "mira_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
mira = { path = "../.." }
# Pinned to the revision that can draw over a host's frame and say which events it took.
armature = { git = "https://github.com/mcdearman/armature", rev = "359d6352b9d097f3b4273db3cdfa602bca48550f" }
armature-render = { git = "https://github.com/mcdearman/armature", rev = "359d6352b9d097f3b4273db3cdfa602bca48550f" }
wgpu = "30.0.1"
winit = "0.30.12"
anyhow = "1"
log = "0.4"
